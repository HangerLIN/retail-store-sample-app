apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-release
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-state
data:
  state.json: '{}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-release
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [catalog, carts, orders, checkout, ui]
  verbs: [get, list, watch, patch]
- apiGroups: ['']
  resources: [pods, services]
  verbs: [get, list]
- apiGroups: ['']
  resources: [pods/portforward]
  verbs: [get, create]
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get]
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [release-state]
  verbs: [patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-release
subjects:
- kind: ServiceAccount
  name: jenkins-release
  namespace: retail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-release
