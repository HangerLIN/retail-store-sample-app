apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    spec:
      containers:
      - $patch: replace
      - name: catalog
        envFrom:
        - configMapRef:
            name: catalog-config
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.6.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 256m
            memory: 256Mi
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        env:
        - name: RETAIL_CATALOG_PERSISTENCE_USER
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: RETAIL_CATALOG_PERSISTENCE_USER
        - name: RETAIL_CATALOG_PERSISTENCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: RETAIL_CATALOG_PERSISTENCE_PASSWORD
