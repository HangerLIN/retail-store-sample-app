apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carts-dynamodb
  labels:
    helm.sh/chart: carts-1.6.3
    app.kubernetes.io/name: carts
    app.kubernetes.io/instance: carts
    app.kubernetes.io/component: dynamodb
    app.kubernetes.io/owner: retail-store-sample
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carts
      app.kubernetes.io/instance: carts
      app.kubernetes.io/component: dynamodb
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carts
        app.kubernetes.io/instance: carts
        app.kubernetes.io/component: dynamodb
        app.kubernetes.io/owner: retail-store-sample
    spec:
      containers:
      - name: dynamodb
        image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:1.25.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: dynamodb
          containerPort: 8000
          protocol: TCP
        command:
        - java
        - -Xmx256m
        - -jar
        - DynamoDBLocal.jar
        - -sharedDb
        - -dbPath
        - /data
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: carts-dynamodb
  serviceName: carts-dynamodb
