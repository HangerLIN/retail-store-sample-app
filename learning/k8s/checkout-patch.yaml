apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    spec:
      containers:
      - $patch: replace
      - name: checkout
        envFrom:
        - configMapRef:
            name: checkout-config
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        image: public.ecr.aws/aws-containers/retail-store-sample-checkout:1.6.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 128m
            memory: 256Mi
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        env: []
