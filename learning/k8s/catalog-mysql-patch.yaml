apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-mysql
spec:
  template:
    spec:
      containers:
      - $patch: replace
      - name: mysql
        image: public.ecr.aws/docker/library/mysql:8.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: catalog
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: RETAIL_CATALOG_PERSISTENCE_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: RETAIL_CATALOG_PERSISTENCE_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        ports:
        - name: mysql
          containerPort: 3306
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        args:
        - --innodb-buffer-pool-size=64M
        - --performance-schema=OFF
      volumes:
      - $patch: replace
      - name: data
        persistentVolumeClaim:
          claimName: catalog-mysql
